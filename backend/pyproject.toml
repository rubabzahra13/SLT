[project]
name = "slt-crm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "sqlalchemy>=2.0.28",
  "alembic>=1.13.1",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.6.4",
  "email-validator>=2.1.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "app.main:app"
